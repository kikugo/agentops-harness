[project]
name = "agentops-harness"
version = "0.1.0"
description = "Red-team, guard and trace harness for the Droit du Travail Copilot agent"
readme = "README.md"
authors = [
    { name = "Karthik Reddy Changal", email = "83645138+kikugo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.26",
    "azure-search-documents>=12,<13",
    "fastapi>=0.162",
    "httpx>=0.28",
    "numpy>=2.5",
    "openai>=3.37",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-processor-baggage==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "pyrit>=1.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["vendor"]
